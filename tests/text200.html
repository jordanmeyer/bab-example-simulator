<!doctype html><html lang="en"><head><meta charset="utf-8"><title>200% text simulator QA</title><style>body{margin:0}iframe{width:1280px;height:1100px;border:0;display:block}pre{white-space:pre-wrap}</style></head><body><iframe title="1280px simulator with 200% text"></iframe><button id="measure">Capture layout metrics</button><pre id="qa">Loading…</pre><script>
const frame=document.querySelector('iframe');frame.src=location.pathname.includes('/tests/')?'/app/':'./index.html';
frame.addEventListener('load',()=>{const d=frame.contentDocument;d.documentElement.style.fontSize='200%';const run=()=>{if(d.querySelector('.run').disabled)return;observer.disconnect();d.querySelector('#scenario').requestSubmit();};const observer=new MutationObserver(run);observer.observe(d.querySelector('.run'),{attributes:true,attributeFilter:['disabled']});run();});
document.querySelector('#measure').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;document.querySelector('#qa').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,rootFont:w.getComputedStyle(d.documentElement).fontSize,bodyFont:w.getComputedStyle(d.body).fontSize,height:d.documentElement.scrollHeight,status:d.querySelector('#form-status').textContent,controls:[...d.querySelectorAll('button,input,select,summary,a')].filter(e=>e.getClientRects().length).map(e=>({text:e.textContent||e.name,width:e.getBoundingClientRect().width,height:e.getBoundingClientRect().height}))},null,2);};
</script></body></html>
